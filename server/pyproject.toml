[project]
name = "zeno-server"
version = "0.1.0"
description = "ZENO voice assistant server (FastAPI + Pipecat)"
readme = "README.md"
authors = [
    { name = "Amuo007", email = "amrinderbalhar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "google-auth>=2.61.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pipecat-ai[anthropic,google,kokoro,mcp,pocket-tts,runner,webrtc,whisper]>=1.12.0",
    # MLX speech-to-text runs only on Apple silicon; other platforms use faster-whisper.
    "pipecat-ai[mlx-whisper]>=1.12.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pypdf>=5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
zeno-server = "zeno_server.app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
